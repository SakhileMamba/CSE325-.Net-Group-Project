name: Deploy Social Net to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SocialMediaApp/SocialMediaApp.csproj

      - name: Build
        run: dotnet build SocialMediaApp/SocialMediaApp.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish SocialMediaApp/SocialMediaApp.csproj --configuration Release --no-build --output publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
